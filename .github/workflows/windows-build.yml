name: Windows x64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Use crates.io on the hosted runner
        shell: pwsh
        run: Remove-Item .cargo/config.toml

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        shell: pwsh
        run: |
          node scripts/run-cargo.cjs fmt --manifest-path engine/Cargo.toml --package recorder-engine -- --check
          cargo fmt --manifest-path engine/vendor/cpal/Cargo.toml -- --check
          cargo fmt --manifest-path engine/vendor/cpal/asio-sys/Cargo.toml -- --check

      - name: Run strict Rust lints
        run: node scripts/run-cargo.cjs clippy --manifest-path engine/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run vendored CPAL Windows audio patch tests
        run: cargo test --manifest-path engine/vendor/cpal/Cargo.toml --lib --features asio

      - name: Run vendored ASIO callback metadata tests
        run: cargo test --manifest-path engine/vendor/cpal/asio-sys/Cargo.toml --lib

      - name: Run tests including deterministic engine kill recovery
        run: npm test

      - name: Run real Electron P1 golden flows
        run: npm run test:e2e:electron

      - name: Build Windows NSIS installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify packaged acceptance toolkit
        shell: pwsh
        run: |
          $resources = Join-Path "dist/win-unpacked" "resources"
          $acceptance = Join-Path $resources "acceptance/windows-audio-acceptance.cjs"
          $launcher = Join-Path $resources "acceptance/run-windows-audio-acceptance.ps1"
          $cmdLauncher = Join-Path $resources "acceptance/run-windows-audio-acceptance.cmd"
          $qualification = Join-Path $resources "acceptance/windows-audio-qualification.cjs"
          $qualificationLauncher = Join-Path $resources "acceptance/run-windows-audio-qualification.cmd"
          $qualificationPowerShell = Join-Path $resources "acceptance/run-windows-audio-qualification.ps1"
          $qualificationSchema = Join-Path $resources "acceptance/windows-audio-qualification-plan.schema.json"
          $qualificationExample = Join-Path $resources "acceptance/Windows外置声卡资格计划.example.json"
          $acceptanceDoc = Join-Path $resources "acceptance/Windows外置声卡生产验收.md"
          $pilotReleaseNotes = Join-Path $resources "acceptance/受控试运行说明.md"
          $engine = Join-Path $resources "bin/recorder-engine.exe"
          foreach ($required in @($acceptance, $launcher, $cmdLauncher, $qualification, $qualificationLauncher, $qualificationPowerShell, $qualificationSchema, $qualificationExample, $acceptanceDoc, $pilotReleaseNotes, $engine)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Packaged acceptance resource is missing: $required"
            }
          }
          $hostExecutable = Get-ChildItem -LiteralPath "dist/win-unpacked" -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "(?i)unins|uninstall|update" } |
            Select-Object -First 1
          if ($null -eq $hostExecutable) {
            throw "Packaged Electron executable was not found"
          }
          $inventoryRoot = Join-Path $env:RUNNER_TEMP "databaker-packaged-inventory"
          if (Test-Path -LiteralPath $inventoryRoot) {
            Remove-Item -LiteralPath $inventoryRoot -Recurse -Force
          }
          $PSNativeCommandUseErrorActionPreference = $false
          & $cmdLauncher --mode inventory --output $inventoryRoot --yes
          $inventoryExit = $LASTEXITCODE
          # A hosted runner normally has no input device, so inventory returns
          # the accepted product-level FAIL code 1. GitHub's pwsh wrapper would
          # otherwise propagate that stale native exit code after our report
          # checks succeed.
          $global:LASTEXITCODE = 0
          if ($inventoryExit -notin @(0, 1)) {
            throw "Packaged acceptance inventory was incomplete (exit $inventoryExit)"
          }
          $reportFile = Get-ChildItem -LiteralPath $inventoryRoot -Filter "acceptance-report.json" -File -Recurse |
            Select-Object -First 1
          if ($null -eq $reportFile) {
            throw "Packaged acceptance inventory did not write a report"
          }
          $report = Get-Content -LiteralPath $reportFile.FullName -Raw | ConvertFrom-Json
          if ($report.overall -notin @("PASS", "FAIL") -or $null -ne $report.tool_error) {
            throw "Packaged acceptance inventory did not complete cleanly: $($report.overall) $($report.tool_error)"
          }
          $cleanExit = $report.checks | Where-Object { $_.id -eq "engine-clean-exit" } | Select-Object -First 1
          if ($null -eq $cleanExit -or $cleanExit.status -ne "PASS") {
            throw "Packaged recorder-engine did not complete a clean JSONL protocol lifecycle"
          }
          $protocolLog = Join-Path $reportFile.DirectoryName "protocol.jsonl"
          if (-not (Test-Path -LiteralPath $protocolLog -PathType Leaf) -or (Get-Item $protocolLog).Length -eq 0) {
            throw "Packaged acceptance inventory did not record protocol traffic"
          }
          & $qualificationLauncher --help | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged qualification launcher could not start"
          }

      - name: Verify generated installer payload
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "dist" -Filter "DataBaker-Recorder-*-Windows-x64.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows x64 installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) {
            throw "Generated installer is unexpectedly small: $($installer.Length) bytes"
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "databaker-installed-payload"
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent installer smoke test failed with exit $($install.ExitCode)"
          }

          $installedLauncher = Join-Path $installRoot "resources/acceptance/run-windows-audio-acceptance.cmd"
          $installedQualification = Join-Path $installRoot "resources/acceptance/run-windows-audio-qualification.cmd"
          $installedQualificationExample = Join-Path $installRoot "resources/acceptance/Windows外置声卡资格计划.example.json"
          $installedPilotReleaseNotes = Join-Path $installRoot "resources/acceptance/受控试运行说明.md"
          $installedEngine = Join-Path $installRoot "resources/bin/recorder-engine.exe"
          foreach ($required in @($installedLauncher, $installedQualification, $installedQualificationExample, $installedPilotReleaseNotes, $installedEngine)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Installed production payload is missing: $required"
            }
          }
          $installedInventoryRoot = Join-Path $env:RUNNER_TEMP "databaker-installed-inventory"
          if (Test-Path -LiteralPath $installedInventoryRoot) {
            Remove-Item -LiteralPath $installedInventoryRoot -Recurse -Force
          }
          $PSNativeCommandUseErrorActionPreference = $false
          & $installedLauncher --mode inventory --output $installedInventoryRoot --yes
          $inventoryExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($inventoryExit -notin @(0, 1)) {
            throw "Installed acceptance toolkit was incomplete (exit $inventoryExit)"
          }
          $reportFile = Get-ChildItem -LiteralPath $installedInventoryRoot -Filter "acceptance-report.json" -File -Recurse |
            Select-Object -First 1
          if ($null -eq $reportFile) {
            throw "Installed acceptance toolkit did not write a report"
          }
          $report = Get-Content -LiteralPath $reportFile.FullName -Raw | ConvertFrom-Json
          $cleanExit = $report.checks | Where-Object { $_.id -eq "engine-clean-exit" } | Select-Object -First 1
          if ($report.overall -notin @("PASS", "FAIL") -or $null -ne $report.tool_error -or $cleanExit.status -ne "PASS") {
            throw "Installed recorder-engine did not complete a clean JSONL lifecycle"
          }
          & $installedQualification --help | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Installed qualification launcher could not start"
          }

          # Prove the installed Electron-as-Node launcher can load Ajv from
          # app.asar and rejects a schema-invalid plan before writing output.
          $invalidQualificationRoot = Join-Path $env:RUNNER_TEMP "databaker-installed-invalid-qualification"
          if (Test-Path -LiteralPath $invalidQualificationRoot) {
            Remove-Item -LiteralPath $invalidQualificationRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $invalidQualificationRoot | Out-Null
          $invalidPlan = Get-Content -LiteralPath $installedQualificationExample -Raw | ConvertFrom-Json
          $invalidPlan | Add-Member -NotePropertyName schema_bypass_probe -NotePropertyValue $true
          $invalidPlanPath = Join-Path $invalidQualificationRoot "qualification-plan.json"
          $invalidPlan | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $invalidPlanPath -Encoding utf8NoBOM
          $invalidOutput = & $installedQualification --plan $invalidPlanPath --reports $invalidQualificationRoot 2>&1
          $schemaExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $invalidOutput | Out-Host
          if ($schemaExit -ne 2 -or ($invalidOutput -join "`n") -notmatch "strict JSON Schema") {
            throw "Installed qualification launcher did not enforce the strict runtime schema (exit $schemaExit)"
          }
          if (Test-Path -LiteralPath (Join-Path $invalidQualificationRoot "qualification-report.json")) {
            throw "Schema-invalid installed qualification plan wrote an output report"
          }

          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256 *$($installer.Name)" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: databaker-recorder-windows-x64
          path: |
            dist/DataBaker-Recorder-*-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
