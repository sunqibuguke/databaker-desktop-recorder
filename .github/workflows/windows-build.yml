name: Windows x64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Use crates.io on the hosted runner
        shell: pwsh
        run: Remove-Item .cargo/config.toml

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: node scripts/run-cargo.cjs fmt --manifest-path engine/Cargo.toml -- --check

      - name: Run strict Rust lints
        run: node scripts/run-cargo.cjs clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

      - name: Run type and Rust tests
        run: npm test

      - name: Build Windows NSIS installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged acceptance toolkit
        shell: pwsh
        run: |
          $resources = Join-Path "dist/win-unpacked" "resources"
          $acceptance = Join-Path $resources "acceptance/windows-audio-acceptance.cjs"
          $launcher = Join-Path $resources "acceptance/run-windows-audio-acceptance.ps1"
          $engine = Join-Path $resources "bin/recorder-engine.exe"
          foreach ($required in @($acceptance, $launcher, $engine)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Packaged acceptance resource is missing: $required"
            }
          }
          $hostExecutable = Get-ChildItem -LiteralPath "dist/win-unpacked" -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "(?i)unins|uninstall|update" } |
            Select-Object -First 1
          if ($null -eq $hostExecutable) {
            throw "Packaged Electron executable was not found"
          }
          $env:ELECTRON_RUN_AS_NODE = "1"
          & $hostExecutable.FullName $acceptance --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged acceptance toolkit failed to start (exit $LASTEXITCODE)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: databaker-recorder-windows-x64
          path: |
            dist/DataBaker-Recorder-*-Windows-x64.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
