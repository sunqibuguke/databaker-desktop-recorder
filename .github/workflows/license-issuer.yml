name: License Issuer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/license-issuer-exe/**'
      - 'scripts/test-license-issuer-exe.cjs'
      - 'scripts/package-license-issuer.cjs'
      - 'electron/license.ts'
      - '.github/workflows/license-issuer.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/license-issuer-exe/**'
      - 'scripts/test-license-issuer-exe.cjs'
      - 'scripts/package-license-issuer.cjs'
      - 'electron/license.ts'
      - '.github/workflows/license-issuer.yml'

permissions:
  contents: read

concurrency:
  group: license-issuer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Use crates.io on the hosted runner
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Cache issuer crates
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/license-issuer-exe

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Compile license module
        run: npx tsc -p electron/tsconfig.json

      - name: Test native issuer
        run: node scripts/test-license-issuer-exe.cjs

      - name: Package issuer
        run: node scripts/package-license-issuer.cjs
        env:
          DATABAKER_LICENSE_PRIVATE_KEY: ${{ secrets.DATABAKER_LICENSE_PRIVATE_KEY }}

      - name: Upload Windows exe
        uses: actions/upload-artifact@v6
        with:
          name: DataBaker-License-Issuer-Windows-x64
          path: release/issuer/
          if-no-files-found: error
          retention-days: 14
