[package]
name = "recorder-engine"
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[features]
default = []
system-test = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# Keep CPAL 0.18.1 local so the Windows capture-discontinuity fix remains
# reproducible and does not depend on an unreleased Git revision.
# Raise the platform audio callback to its realtime/MMCSS class where CPAL
# supports it. This is particularly important for Windows USB interfaces under
# CPU or DPC pressure; capture faults still remain fail-closed.
cpal = { path = "vendor/cpal", features = ["realtime"] }
crossbeam-channel = "0.5"
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
